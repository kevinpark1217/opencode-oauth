name: Feature request
description: A new capability, or support for another identity provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the plugin should do. Links to the relevant RFC or the provider's documentation help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you considered.
  - type: input
    id: identity-provider
    attributes:
      label: Identity provider
      description: If this is about a particular provider, which one and which version.
