name: Feature request
description: A new capability, or support for another identity provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what stops you today. Name your identity provider if it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the plugin should do. Links to the relevant RFC or provider docs help.
    validations:
      required: true
