name: Bug report
description: Something doesn't work as the README describes
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The steps you took, what you saw, and what you expected. Quote error messages exactly.
      placeholder: |
        Ran `opencode auth login my-llm` and signed in. The browser tab said "token endpoint answered 400 (invalid_grant)".
        Expected the sign-in to finish.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Versions of opencode-oauth and OpenCode (`opencode --version`), your operating system, and your identity provider.
      placeholder: opencode-oauth 0.1.0, OpenCode 2.1.4, macOS, Keycloak 26
    validations:
      required: true
  - type: textarea
    id: plugin-entry
    attributes:
      label: Plugin entry
      description: The plugin's entry from your OpenCode config, if it matters. Remove secrets; changing host names is fine.
      render: jsonc
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from OpenCode's log (`opencode debug paths` shows where it is). Remove tokens and secrets.
      render: text
