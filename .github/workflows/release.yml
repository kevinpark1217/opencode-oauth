name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no token secret, and provenance is attached.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # This Node's bundled npm must be 11.15.0 or later for `npm stage publish`.
      # No registry-url: the .npmrc it would write sets the token to an unset
      # ${NODE_AUTH_TOKEN}, which npm keeps as a literal string and falls back
      # to when the OIDC exchange fails, turning that into an opaque 404
      # instead of a sign-in error (ENEEDAUTH).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun test
      # Staged: the version waits on npmjs.com until a maintainer approves it
      # with 2FA. The trusted publisher on npmjs.com is set to allow only this;
      # keep it that way. --provenance makes staging fail rather than go out
      # without a provenance statement.
      - run: npm stage publish --provenance
